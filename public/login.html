<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
    <div class="container">
        <form id="formLoginPage">
            <h2>Login</h2>
            <div class="form-group">
                <label>Usuário ou E-mail</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
            <p id="msgLoginPage"></p>
            <p><a href="index.html">Voltar para Cadastro</a></p>
        </form>

        <div id="profileSection" class="profile hidden">
            <div class="profile-card">
                <img id="profileImage" src="" alt="Foto do aluno">
                <h2 id="profileName"></h2>
                <p><strong>Usuário:</strong> <span id="profileUsuario"></span></p>
                <p><strong>E-mail:</strong> <span id="profileEmail"></span></p>
                <p><strong>Observação:</strong> <span id="profileObservacao"></span></p>
                <button id="btnLogout" type="button">Sair</button>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
